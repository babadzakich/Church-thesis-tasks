name: Hakaton Hidden Tests

on:
  pull_request_target:
    branches:
      - "vovatask"

permissions:
  contents: read
  pull-requests: write

jobs:
  hidden-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted

      - name: Checkout PR head into isolated directory
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect submitted solution
        id: detect
        working-directory: trusted
        run: |
          python3 ci/select_submission.py \
            --task-dir hakaton \
            --candidate-root ../candidate \
            --baseline-root . > /tmp/hakaton_source.txt
          echo "source=$(cat /tmp/hakaton_source.txt)" >> "$GITHUB_OUTPUT"

      - name: Run hidden tests against trusted reference
        working-directory: trusted
        run: |
          python3 ci/run_task_tests.py \
            --task-dir hakaton \
            --source "${{ steps.detect.outputs.source }}" \
            --tests-subdir tests/hard \
            --expected-mode reference \
            --reference-source hakaton/solution.cpp \
            --visibility hidden \
            --timeout-sec 8

      - name: Comment result
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Hidden tests passed."
            })

      - name: Comment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Hidden tests failed."
            })
